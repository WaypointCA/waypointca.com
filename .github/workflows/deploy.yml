name: Build and deploy site

# The main site is hand-authored static HTML at the repo root. The blog is a
# Hugo site in blog-src/ that builds into /blog. This workflow assembles both
# into one artifact so waypointca.com and waypointca.com/blog ship together.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned. blog-src/hugo.toml declares a matching module.hugoVersion
      # range, so a drift between CI and a local machine fails the build
      # rather than producing silently different output.
      HUGO_VERSION: 0.155.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate curriculum pages
        # Rendered from curriculum/content.py so the eight pages share one
        # shell and cannot drift from index.html's design tokens, nav, or
        # footer. Also enforces the no-em-dash house style and fails on
        # violation.
        run: python3 curriculum/build.py

      - name: Assemble static root
        # Everything at the repo root ships as-is: index.html, 404.html,
        # CNAME, robots.txt, sitemaps, favicon, assets/ (capability statement
        # PDFs, social card, favicons), ai-security/.
        # Excluded: build inputs and VCS metadata.
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'blog-src' \
            --exclude '/curriculum' \
            --exclude '_site' \
            --exclude '.claude' \
            --exclude '.gitignore'

      - name: Build blog into /blog
        run: |
          hugo \
            --source blog-src \
            --destination "${GITHUB_WORKSPACE}/_site/blog" \
            --baseURL "https://waypointca.com/blog/" \
            --minify \
            --gc

      - name: Verify required root assets survived assembly
        # A missing capability statement is a silent, business-visible
        # regression, so fail the build rather than deploy without them.
        run: |
          required=(
            "index.html"
            "404.html"
            "CNAME"
            "robots.txt"
            "sitemap.xml"
            "sitemap-main.xml"
            "favicon.ico"
            "ai-security/index.html"
            "ai-security/curriculum/index.html"
            "ai-security/curriculum/llm-agent-security-red-teaming/index.html"
            "assets/waypoint-og.png"
            "assets/favicon.ico"
            "assets/favicon-16x16.png"
            "assets/favicon-32x32.png"
            "assets/apple-touch-icon.png"
            "assets/Waypoint_CapStmt_Federal.pdf"
            "assets/Waypoint_CapStmt_Defense.pdf"
            "assets/Waypoint_CapStmt_Aerospace.pdf"
            "assets/Waypoint_CapStmt_Healthcare.pdf"
            "assets/Waypoint_CapStmt_State.pdf"
            "blog/index.html"
            "blog/sitemap.xml"
            "blog/index.xml"
            "blog/posts/index.html"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ -s "_site/$f" ]; then
              printf '  ok      %s\n' "$f"
            else
              printf '  MISSING %s\n' "$f"; missing=1
            fi
          done
          echo "blog post pages built: $(find _site/blog/posts -mindepth 1 -maxdepth 1 -type d | wc -l)"
          [ "$missing" -eq 0 ] || { echo "::error::required asset(s) missing from artifact"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
